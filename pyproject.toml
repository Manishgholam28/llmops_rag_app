[project]
name = "llmops-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dagshub>=0.7.3",
    "deepeval>=4.3.2",
    "fastapi>=0.162.0",
    "guardrails-ai>=0.11.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.1",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "mlflow>=3.17.2",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
